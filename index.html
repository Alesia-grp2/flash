<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2b5fd9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vocalésia">
<title>Vocalésia</title>
<style>
:root{
  --bg:#f5f6fb; --card:#ffffff; --ink:#1c2230; --mute:#667085; --line:#e1e5ee;
  --accent:#2b5fd9; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --again:#d64545; --hard:#c97a12; --good:#2a9560; --easy:#2b7fd9;
  --warn-bg:#fff4d6; --warn-ink:#6b4a00; --radius:16px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#11141b; --card:#1a1f2d; --ink:#eef1f8; --mute:#9aa4b8; --line:#2a3146;
    --accent:#7a9dff; --accent-ink:#0d1220; --accent-soft:#222a44;
    --again:#ef6a6a; --hard:#e8a04a; --good:#4cc088; --easy:#6aa8f5;
    --warn-bg:#3a2f12; --warn-ink:#ffd98a;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px}
header{padding:18px 0 8px}
h1{font-size:1.3rem;margin:0}
nav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:10px 0 18px}
nav button{flex:1;border:0;background:transparent;color:var(--mute);font:inherit;font-weight:600;padding:9px 6px;border-radius:999px;cursor:pointer;position:relative}
nav button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;min-width:1.3em;padding:0 6px;margin-left:6px;border-radius:999px;background:var(--again);color:#fff;font-size:.75rem;line-height:1.5}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.muted{color:var(--mute)}
.small{font-size:.9rem}
.stats{display:flex;gap:10px;margin:6px 0 16px}
.stat{flex:1;background:var(--accent-soft);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font-size:1.6rem;line-height:1.2}
button.primary{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:14px;border-radius:12px;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:default}
button.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:10px 14px;border-radius:10px;cursor:pointer}
.notice{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.95rem}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 18px;text-align:center;margin:12px 0}
.label{color:var(--mute);font-size:.85rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 12px}
.bigspeak{width:92px;height:92px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;cursor:pointer;margin:6px 0 10px}
.speak{border:1px solid var(--line);background:var(--accent-soft);border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1.05rem;flex:none}
.word{font-size:2rem;font-weight:700;margin:4px 0}
.def{font-size:1.15rem;margin:6px 0}
.sep{border:0;border-top:1px dashed var(--line);margin:18px 0}
.examples{list-style:none;padding:0;margin:10px 0 0;text-align:left}
.examples li{display:flex;gap:10px;align-items:center;padding:6px 0}
.example-one{display:flex;gap:10px;align-items:center;text-align:left;margin-top:12px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.rates button{border:0;border-radius:12px;padding:10px 4px;font:inherit;font-weight:700;color:#fff;cursor:pointer;line-height:1.25}
.rates small{display:block;font-weight:500;opacity:.92;font-size:.75rem}
.r0{background:var(--again)}.r1{background:var(--hard)}.r2{background:var(--good)}.r3{background:var(--easy)}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--card)}
summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary .count{margin-left:auto;font-weight:500;color:var(--mute);font-size:.9rem;white-space:nowrap;flex:none}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.row label{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}
.row .t{display:flex;flex-direction:column;min-width:0}
.row .t span:first-child{font-weight:600}
.chip{font-size:.75rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start;margin-top:2px}
.chip.new{background:var(--again);color:#fff}
input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--accent)}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field input[type=number],.field select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:55%}
.field input[type=number]{width:5.5em}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hintbox{display:inline-flex;gap:8px;align-items:center;cursor:pointer;color:var(--mute);margin-top:6px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toprow .secondary{padding:6px 12px}
.fresh{color:var(--again)}
.tri{flex:none;width:0;height:0;margin:0 4px 0 2px;border-left:14px solid var(--accent);border-top:9px solid transparent;border-bottom:9px solid transparent;transition:transform .15s}
details[open] > summary .tri{transform:rotate(90deg)}
.blank{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em;vertical-align:baseline}
.cloze-label{color:var(--mute);font-size:.85rem;margin:16px 0 4px}
.cloze{font-size:1.15rem;font-style:italic;margin:0}
.cloze-row{display:flex;gap:10px;align-items:center;justify-content:center;text-align:left;margin:12px 0 0;font-size:1.05rem}
b.hl{color:var(--accent)}
.banner{background:var(--accent-soft);border-radius:var(--radius);padding:14px 18px;margin:16px 0 4px}
.brand{margin:0;font-size:2.25rem;line-height:1.1;font-weight:300;color:var(--ink)}
.brand .b1{display:inline-block;font-weight:700;line-height:1;padding-bottom:3px;border-bottom:4px solid var(--accent)}
.tagline{margin:4px 0 0;font-size:.85rem;color:var(--mute)}
.indice{color:var(--mute);font-size:.85rem;margin:.2rem 0}
/* aide */
.help h2{font-size:1.05rem;margin:1.5rem 0 .5rem;scroll-margin-top:12px}
.help h3{font-size:.95rem;margin:1rem 0 .3rem}
.help p,.help li{line-height:1.5}
.help ul{padding-left:1.25rem;margin:.4rem 0}
.help table{width:100%;border-collapse:collapse;font-size:.88rem;margin:.6rem 0}
.help th,.help td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;overflow-wrap:break-word}
.help th{background:var(--card)}
.help .toc{list-style:none;padding:0;margin:0}
.help .toc li{margin:0}
.help .toc a,.help .toplink{color:var(--accent);text-decoration:none;cursor:pointer}
.help .toc a{display:block;padding:7px 2px;border-bottom:1px solid var(--line)}
.help .toplink{display:inline-block;margin:.6rem 0 0;font-size:.85rem}
.help .notice{margin:.8rem 0}
.help .intro{margin-top:.4rem}
.help .btnrow .primary{width:auto;padding:10px 18px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <h1 class="brand" aria-label="Vocalésia"><span class="b1" aria-hidden="true">Voc</span><span aria-hidden="true">alésia</span></h1>
    <p id="title" class="tagline">Vocabulaire</p>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" id="tab-review" aria-selected="true">Réviser</button>
    <button role="tab" id="tab-cards" aria-selected="false">Cartes<span id="badge" class="badge" hidden></span></button>
    <button role="tab" id="tab-settings" aria-selected="false">Réglages</button>
    <button role="tab" id="tab-help" aria-selected="false">Aide</button>
  </nav>
  <div id="warn"></div>
  <main>
    <section id="view-review"></section>
    <section id="view-cards" hidden></section>
    <section id="view-settings" hidden></section>
    <section id="view-help" hidden></section>
    <section id="view-choice" hidden></section>
  </main>
</div>

<script src="paquets.js" onload="window.__paquetsLu = true"></script>
<script>
/* ===================================================================
 *  1) Logique pure (planification des révisions) — testable sans écran
 * =================================================================== */
(function (root) {
  'use strict';
  var DAY = 86400000;

  function dayNumber(d) {
    d = d || new Date();
    return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY);
  }
  function clampEF(x) { return Math.min(3.0, Math.max(1.3, x)); }

  // q : 0 = Encore, 1 = Difficile, 2 = Bien, 3 = Facile
  // Variante simplifiée de SM-2 (l'algorithme historique d'Anki), intervalles en jours.
  function schedule(prev, q, today) {
    var s = Object.assign({ reps: 0, ef: 2.5, ivl: 0, lapses: 0, due: today }, prev || {});
    delete s.ph;
    if (q === 0) {
      if (s.reps > 0) s.lapses++;
      s.reps = 0; s.ef = clampEF(s.ef - 0.2); s.ivl = 0; s.due = today;
      return s;
    }
    var ivl;
    if (s.reps === 0)      ivl = (q === 3) ? 4 : 1;
    else if (s.reps === 1) ivl = (q === 1) ? 2 : (q === 2) ? 3 : 7;
    else {
      var f = (q === 1) ? 1.2 : (q === 2) ? s.ef : s.ef * 1.3;
      ivl = Math.max(Math.round(s.ivl * f), s.ivl + 1);
    }
    if (q === 1) s.ef = clampEF(s.ef - 0.15);
    if (q === 3) s.ef = clampEF(s.ef + 0.15);
    s.reps++; s.ivl = ivl; s.due = today + ivl;
    return s;
  }

  function labelInterval(days) {
    if (days < 1) return 'bientôt';
    if (days === 1) return '1 jour';
    if (days < 30) return days + ' jours';
    if (days < 365) return Math.round(days / 30) + ' mois';
    return (Math.round(days / 36.5) / 10).toString().replace('.', ',') + ' an';
  }

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  root.Core = { dayNumber: dayNumber, schedule: schedule, labelInterval: labelInterval, shuffle: shuffle };
})(typeof window !== 'undefined' ? window : globalThis);

/* ===================================================================
 *  2) Application
 * =================================================================== */
/* ===================================================================
 *  Aide intégrée (français / English). Contenu statique.
 * =================================================================== */
var AIDE = {
  fr: {
    titre: 'Aide',
    intro: "Vocalésia t'aide à retenir du vocabulaire grâce à des cartes. Les mots que tu connais bien reviennent à intervalles de plus en plus longs (<b>révision espacée</b>), les mots difficiles reviennent plus vite. Rien à installer, aucun compte à créer.",
    sommaire: 'Sommaire',
    haut: '↑ Sommaire',
    sections: [
      { id: 'demarrer', t: "1. Ouvrir l'application", h: [
        "<p>Ouvre le lien donné par ton professeur dans le navigateur de ton téléphone (Safari sur iPhone, Chrome sur Android) ou de ton ordinateur.</p>",
        "<p>Place l'application sur l'écran d'accueil, pour la retrouver comme une application :</p>",
        "<ul><li><b>iPhone (Safari)</b> : touche le bouton Partager, puis « Sur l'écran d'accueil ».</li>",
        "<li><b>Android (Chrome)</b> : touche le menu ⋮, puis « Ajouter à l'écran d'accueil » (ou « Installer l'application »).</li></ul>",
        "<p>Ouvre ensuite toujours l'application par cette icône : tu retrouveras ta progression.</p>",
        "<div class='notice'><b>Important.</b> Ta progression est enregistrée dans ce navigateur, sur cet appareil. Si tu utilises un autre navigateur ou un autre appareil, tu repartiras de zéro (voir la section 7 pour la déplacer).</div>"] },
      { id: 'cartes', t: "2. Choisir les cartes (onglet « Cartes »)", h: [
        "<ul><li>Les mots sont rangés par leçon. <b>Coche</b> les mots que tu veux mémoriser, ou la case de la leçon pour tout cocher d'un coup. Seules les cartes cochées te sont proposées.</li>",
        "<li>Le compteur à droite de chaque leçon indique combien de cartes tu as cochées (par exemple 3 / 7).</li>",
        "<li>Le <b>triangle</b> à gauche d'une leçon permet de la replier ou de la développer. La case <b>« Tout réduire »</b> replie toutes les leçons d'un coup ; en la décochant, tu les développes toutes.</li>",
        "<li>Le bouton 🔊 d'un mot te le fait écouter.</li>",
        "<li>Un mot suivi d'un <b>astérisque</b> (par exemple « un flic* ») appartient au <b>registre familier</b> : on l'entend à l'oral entre amis, mais on l'évite à l'écrit soigné ou avec un supérieur.</li>",
        "<li>À côté de chaque mot déjà étudié, une pastille indique quand il reviendra : « À revoir », « Demain » ou « Dans n j ».</li>",
        "<li><b>Nouveautés</b> : quand ton professeur ajoute des cartes, un badge rouge apparaît sur l'onglet « Cartes ». Les nouveaux mots et leur leçon s'affichent en rouge, avec la pastille « Nouveau », jusqu'au prochain ajout.</li></ul>"] },
      { id: 'reviser', t: "3. Réviser (onglet « Réviser »)", h: [
        "<p>L'écran d'accueil indique le nombre de cartes <b>à revoir</b> et de <b>nouvelles</b> cartes du jour. Touche « Commencer » pour lancer une séance. Une barre de progression te montre où tu en es.</p>",
        "<h3>Les deux types de cartes</h3>",
        "<ul><li><b>« Écoute le mot »</b> : tu entends un mot. Essaie de le reconnaître et d'en retrouver le sens. Quand un mot a plusieurs sens, un « Indice » s'affiche pour te dire lequel est demandé. Touche 🔊 pour le réécouter. Si tu n'as pas bien compris le mot, coche « Je n'ai pas bien compris le mot : afficher l'écrit » : il s'affiche sans que l'audio soit relancé. Puis touche « Afficher la réponse » : tu vois le mot, sa définition et des exemples.</li>",
        "<li><b>« Quel est le mot ? »</b> : tu lis une définition. Parfois, une phrase est proposée avec un blanc (« Complète la phrase ») : le mot cherché peut y être accordé ou conjugué, pense à la forme qui convient (par exemple « emménager » devient « emménagé »). Puis touche « Afficher la réponse » : le mot s'affiche et est lu, la phrase est complétée (le mot est en bleu) et d'autres phrases d'exemple apparaissent.</li></ul>",
        "<h3>Noter ta réponse</h3>",
        "<p>Après avoir vu la réponse, choisis honnêtement le bouton qui correspond à ce que tu savais. Le délai avant la prochaine révision est indiqué sur chaque bouton.</p>",
        "<table><tr><th>Bouton</th><th>Quand le choisir</th><th>Ce qui se passe</th></tr>",
        "<tr><td><b>Encore</b></td><td>Je ne savais pas, ou je me suis trompé(e).</td><td>La carte revient dans la même séance, après quelques autres cartes, souvent sous l'autre forme.</td></tr>",
        "<tr><td><b>Difficile</b></td><td>J'ai trouvé, mais avec beaucoup d'hésitation.</td><td>La carte revient bientôt, avec un délai un peu plus long qu'avant.</td></tr>",
        "<tr><td><b>Bien</b></td><td>J'ai trouvé sans trop de difficulté.</td><td>Le délai s'allonge normalement (par exemple 1 jour, puis 3, puis 8, puis 20 jours…).</td></tr>",
        "<tr><td><b>Facile</b></td><td>C'était évident.</td><td>Le délai s'allonge beaucoup.</td></tr></table>"] },
      { id: 'arreter', t: "4. Arrêter une séance", h: [
        "<p>Touche <b>« Terminer »</b> (en haut à droite, à côté du compteur) pour arrêter quand tu veux. Ta progression est enregistrée après chaque carte : les cartes que tu n'as pas faites te seront reproposées. Tu peux relancer une séance avec « Commencer ».</p>"] },
      { id: 'clavier', t: "5. Raccourcis clavier (ordinateur)", h: [
        "<table><tr><th>Touche</th><th>Action</th></tr>",
        "<tr><td>Espace ou Entrée</td><td>Afficher la réponse</td></tr>",
        "<tr><td>1, 2, 3, 4</td><td>Noter : Encore, Difficile, Bien, Facile</td></tr>",
        "<tr><td>R</td><td>Réécouter le mot</td></tr>",
        "<tr><td>Échap</td><td>Terminer la séance</td></tr></table>"] },
      { id: 'reglages', t: "6. Les réglages (onglet « Réglages »)", h: [
        "<table><tr><th>Réglage</th><th>Effet</th></tr>",
        "<tr><td>Paquet de cartes</td><td>Visible seulement s'il y a plusieurs paquets. Change de paquet : l'application se recharge avec l'autre paquet, dont la progression est conservée séparément. Au premier lancement, l'application demande quel paquet ouvrir ; ensuite elle rouvre le dernier paquet utilisé. Le nom du paquet s'affiche dans la bannière.</td></tr>",
        "<tr><td>Nouvelles cartes par jour</td><td>Nombre maximal de nouveaux mots proposés chaque jour (10 par défaut). Mets moins si tu es débordé(e).</td></tr>",
        "<tr><td>Lecture audio automatique</td><td>Lit le mot dès que la carte s'affiche ou que la réponse apparaît.</td></tr>",
        "<tr><td>Suivi des cartes</td><td>« Un seul suivi par mot » : un mot compte pour une révision, quel que soit le type de carte. « Suivi séparé par type d'exercice » : l'écoute et la définition sont planifiées chacune de leur côté ; tu révises environ deux fois plus de cartes mais tu suis mieux chaque compétence. Le changement demande une confirmation.</td></tr>",
        "<tr><td>Voix et vitesse</td><td>Choix de la voix française de l'appareil et vitesse de lecture. Le bouton « Tester la voix » permet d'essayer.</td></tr></table>"] },
      { id: 'sauvegarde', t: "7. Sauvegarder et déplacer sa progression", h: [
        "<ul><li><b>Exporter</b> (ou <b>Exporter ce paquet</b> quand il y a plusieurs paquets) : télécharge un fichier contenant la progression et les réglages du paquet ouvert.</li>",
        "<li><b>Exporter tous les paquets</b> (visible seulement avec plusieurs paquets) : un seul fichier contenant la progression de tous les paquets utilisés sur cet appareil.</li>",
        "<li><b>Importer</b> : recharge un fichier exporté (par exemple sur un nouveau téléphone), après confirmation. Avec une sauvegarde de tous les paquets, une liste à cocher permet de ne restaurer que certains paquets.</li>",
        "<li><b>Réinitialiser</b> (ou <b>Réinitialiser ce paquet</b>) : remet à zéro ta sélection de cartes et ton avancement dans les révisions pour le paquet ouvert ; les autres paquets ne sont pas touchés. Le contenu du paquet, lui, n'est pas enregistré sur ton appareil et n'est donc pas concerné.</li></ul>",
        "<div class='notice'><b>Sécurité.</b> Une sauvegarde d'un paquet ne peut être importée que dans ce même paquet : si tu choisis par erreur le fichier d'un autre paquet, l'application le refuse avec un message et ne modifie rien. Pour restaurer un autre paquet, ouvre-le d'abord (Réglages → Paquet de cartes).</div>",
        "<p><b>Conseil.</b> Exporte ta progression de temps en temps, et toujours avant de changer de téléphone ou d'effacer les données de ton navigateur.</p>",
        "<h3>Quand ma progression peut-elle disparaître ?</h3>",
        "<p>Ta progression est enregistrée dans ton navigateur, sur ton appareil. Elle ne disparaît pas lors d'une mise à jour habituelle du système, mais elle peut être perdue dans ces situations :</p>",
        "<ul><li><b>Longue pause sur iPhone ou iPad</b> : si tu n'ouvres pas Vocalésia pendant une longue période (une semaine ou plus d'utilisation de Safari, par exemple pendant les vacances), Safari peut supprimer les données du site. Ajouter Vocalésia à l'écran d'accueil limite ce risque.</li>",
        "<li><b>Nettoyage du navigateur</b> : « effacer les données de sites », une application de nettoyage ou la réinstallation du navigateur supprime tout.</li>",
        "<li><b>Téléphone presque plein</b> : le système peut libérer de la place en supprimant des données de sites peu utilisés.</li>",
        "<li><b>Autre appareil ou autre navigateur</b> : la progression ne suit pas ; il faut l'exporter puis l'importer.</li>",
        "<li><b>Navigation privée</b> : tout disparaît à la fermeture de la fenêtre.</li></ul>",
        "<div class='notice'><b>À faire avant une longue pause, un changement de téléphone ou un nettoyage.</b> Va dans Réglages et exporte ta progression, puis garde le fichier (dans tes documents, ou envoie-le toi par e-mail). Tu pourras le réimporter si besoin.</div>"] },
      { id: 'conseils', t: "8. Conseils pour bien mémoriser", h: [
        "<ul><li>Révise <b>un peu chaque jour</b> (5 à 10 minutes) plutôt que longtemps de temps en temps.</li>",
        "<li>Ne choisis pas trop de cartes d'un coup : ajoute-les au fur et à mesure des leçons.</li>",
        "<li>Note-toi honnêtement : un « Facile » trop généreux espace trop les révisions.</li>",
        "<li>N'utilise pas la navigation privée et n'efface pas les données du site : tu perdrais ta progression.</li></ul>"] },
      { id: 'problemes', t: "9. En cas de problème", h: [
        "<table><tr><th>Problème</th><th>Que faire ?</th></tr>",
        "<tr><td>Je n'entends rien</td><td>Vérifie le volume du téléphone et qu'il n'est pas en mode silencieux. Va dans « Réglages » et touche « Tester la voix ».</td></tr>",
        "<tr><td>L'application dit qu'aucune voix française n'a été trouvée</td><td>Installe une voix française dans les réglages de ton appareil (accessibilité ou synthèse vocale), puis recharge la page.</td></tr>",
        "<tr><td>Je ne vois pas les nouvelles cartes</td><td>Recharge la page (actualise-la). Attends quelques minutes si ton professeur vient de les publier.</td></tr>",
        "<tr><td>Ma progression a disparu</td><td>Tu utilises peut-être un autre navigateur ou un autre appareil, ou les données du navigateur ont été effacées. Importe ta dernière sauvegarde (section 7).</td></tr>",
        "<tr><td>Un message dit que la progression ne peut pas être enregistrée</td><td>Tu es sans doute en navigation privée. Ouvre l'application dans un onglet normal.</td></tr>",
        "<tr><td>La page est vide ou affiche une erreur</td><td>Préviens ton professeur : le fichier de cartes doit être vérifié.</td></tr></table>"] }
    ]
  },
  en: {
    titre: 'Help',
    intro: "Vocalésia helps you remember vocabulary with flashcards. Words you know well come back after longer and longer intervals (<b>spaced repetition</b>); words you find difficult come back sooner. Nothing to install, no account to create.",
    sommaire: 'Contents',
    haut: '↑ Contents',
    sections: [
      { id: 'glossaire', t: 'Glossary: the app is in French', h: [
        "<p>Buttons and labels appear in French. This help gives the French wording as you will see it, followed by the English meaning, for example <b>Réviser</b> (Review).</p>",
        "<table><tr><th>What you see</th><th>Meaning</th></tr>",
        "<tr><td><b>Réviser</b></td><td>Review (the tab where you practise)</td></tr>",
        "<tr><td><b>Cartes</b></td><td>Cards (the tab where you choose your words)</td></tr>",
        "<tr><td><b>Réglages</b></td><td>Settings</td></tr>",
        "<tr><td><b>Aide</b></td><td>Help</td></tr>",
        "<tr><td><b>Commencer</b></td><td>Start</td></tr>",
        "<tr><td><b>Terminer</b></td><td>Finish / stop the session</td></tr>",
        "<tr><td><b>Afficher la réponse</b></td><td>Show the answer</td></tr>",
        "<tr><td><b>Encore · Difficile · Bien · Facile</b></td><td>Again · Hard · Good · Easy</td></tr>",
        "<tr><td><b>À revoir · Demain · Dans n j</b></td><td>Due now · Tomorrow · In n days</td></tr>",
        "<tr><td><b>Nouveau</b></td><td>New</td></tr>",
        "<tr><td><b>Tout réduire</b></td><td>Collapse all</td></tr>",
        "<tr><td><b>Exporter · Importer · Réinitialiser</b></td><td>Export · Import · Reset</td></tr></table>"] },
      { id: 'demarrer', t: '1. Open the app and add it to your home screen', h: [
        "<p>Open the link your teacher gave you in your phone's browser (Safari on iPhone, Chrome on Android) or on your computer.</p>",
        "<p>Add the app to your home screen so you can open it like any other app:</p>",
        "<ul><li><b>iPhone (Safari):</b> tap the Share button, then “Add to Home Screen”.</li>",
        "<li><b>Android (Chrome):</b> tap the ⋮ menu, then “Add to Home screen” (or “Install app”).</li></ul>",
        "<p>From then on, always open the app from that icon: your progress will be there.</p>",
        "<div class='notice'><b>Important.</b> Your progress is saved in this browser, on this device. If you use another browser or another device, you will start from zero (see section 7 to move your progress).</div>"] },
      { id: 'cartes', t: '2. Choose the cards you want to learn (tab « Cartes »)', h: [
        "<ul><li>Words are grouped by lesson. <b>Tick</b> the words you want to learn, or tick the lesson box to select the whole lesson. Only the ticked cards are offered to you.</li>",
        "<li>The counter to the right of each lesson shows how many cards you have ticked (for example 3 / 7).</li>",
        "<li>The <b>triangle</b> to the left of a lesson folds or unfolds it. The <b>« Tout réduire »</b> (Collapse all) box folds every lesson at once; untick it to unfold them all.</li>",
        "<li>The 🔊 button next to a word plays it.</li>",
        "<li>A word followed by an <b>asterisk</b> (for example « un flic* ») belongs to <b>informal (colloquial) French</b>: you hear it in everyday speech among friends, but you avoid it in careful writing or with a superior.</li>",
        "<li>Next to each word you have already studied, a label tells you when it will come back: « À revoir » (due now), « Demain » (tomorrow) or « Dans n j » (in n days).</li>",
        "<li><b>New words:</b> when your teacher adds cards, a red badge appears on the « Cartes » tab. The new words and their lesson are shown in red, with the label « Nouveau » (New), until the next addition.</li></ul>"] },
      { id: 'reviser', t: '3. Review (tab « Réviser »)', h: [
        "<p>The home screen shows how many cards are <b>due</b> for review and how many <b>new</b> cards you can study today. Tap « Commencer » (Start) to begin a session. A progress bar shows where you are.</p>",
        "<h3>The two kinds of card</h3>",
        "<ul><li><b>« Écoute le mot » (Listen to the word):</b> you hear a word. Try to recognise it and recall its meaning. When a word has several meanings, a hint (« Indice », Hint) tells you which one is asked. Tap 🔊 to hear it again. If you did not understand the word, tick « Je n'ai pas bien compris le mot : afficher l'écrit » (I did not understand the word: show it in writing): the written word appears without replaying the audio. Then tap « Afficher la réponse »: you see the word, its definition and example sentences.</li>",
        "<li><b>« Quel est le mot ? » (What is the word?):</b> you read a definition. Sometimes a sentence is shown with a blank (« Complète la phrase », Complete the sentence): the missing word may need to be agreed or conjugated, so think of the right form (for example “emménager” becomes “emménagé”). Then tap « Afficher la réponse »: the word is displayed and read aloud, the sentence is completed (the word is highlighted in blue) and more example sentences appear.</li></ul>",
        "<h3>Rate your answer</h3>",
        "<p>Once you have seen the answer, honestly choose the button that matches how well you knew it. Each button shows how long it will be before the card comes back.</p>",
        "<table><tr><th>Button</th><th>When to choose it</th><th>What happens</th></tr>",
        "<tr><td><b>Encore</b> (Again)</td><td>I did not know it, or I got it wrong.</td><td>The card comes back in the same session, after a few other cards, often in the other form.</td></tr>",
        "<tr><td><b>Difficile</b> (Hard)</td><td>I found it, but I hesitated a lot.</td><td>The card comes back soon, with a slightly longer delay than before.</td></tr>",
        "<tr><td><b>Bien</b> (Good)</td><td>I found it without much difficulty.</td><td>The delay grows normally (for example 1 day, then 3, then 8, then 20 days…).</td></tr>",
        "<tr><td><b>Facile</b> (Easy)</td><td>It was obvious.</td><td>The delay grows a lot.</td></tr></table>"] },
      { id: 'arreter', t: '4. Stop a session', h: [
        "<p>Tap <b>« Terminer »</b> (top right, next to the counter) to stop whenever you want. Your progress is saved after every card: the cards you have not done will be offered again. You can start a new session with « Commencer ».</p>"] },
      { id: 'clavier', t: '5. Keyboard shortcuts (computer)', h: [
        "<table><tr><th>Key</th><th>Action</th></tr>",
        "<tr><td>Space or Enter</td><td>Show the answer</td></tr>",
        "<tr><td>1, 2, 3, 4</td><td>Rate: Again, Hard, Good, Easy</td></tr>",
        "<tr><td>R</td><td>Replay the word</td></tr>",
        "<tr><td>Esc</td><td>Finish the session</td></tr></table>"] },
      { id: 'reglages', t: '6. Settings (tab « Réglages »)', h: [
        "<table><tr><th>Setting</th><th>Effect</th></tr>",
        "<tr><td><b>Paquet de cartes</b> (Card deck)</td><td>Only shown when there is more than one deck. Switching decks reloads the app with the other deck; the progress of each deck is kept separately. The first time you open the app it asks which deck to open; after that it reopens the deck you used last. The deck's name appears in the banner at the top.</td></tr>",
        "<tr><td><b>Nouvelles cartes par jour</b> (New cards per day)</td><td>The maximum number of new words offered each day (10 by default). Choose fewer if you feel overwhelmed.</td></tr>",
        "<tr><td><b>Lecture audio automatique</b> (Automatic audio)</td><td>Plays the word as soon as the card appears or the answer is shown.</td></tr>",
        "<tr><td><b>Suivi des cartes</b> (Card tracking)</td><td>« Un seul suivi par mot » (One tracking per word): a word counts as one review, whatever the type of card. « Suivi séparé par type d'exercice » (Separate tracking per exercise type): listening and definition are scheduled separately; you review about twice as many cards but follow each skill more closely. Changing this asks for confirmation.</td></tr>",
        "<tr><td><b>Voix et vitesse</b> (Voice and speed)</td><td>Choose the French voice of your device and the reading speed. The « Tester la voix » (Test the voice) button lets you try it.</td></tr></table>"] },
      { id: 'sauvegarde', t: '7. Back up and move your progress', h: [
        "<ul><li><b>Exporter</b> (or <b>Exporter ce paquet</b>, Export this deck, when there are several decks): downloads a file with the progress and settings of the open deck.</li>",
        "<li><b>Exporter tous les paquets</b> (Export all decks, only shown when there are several decks): a single file containing the progress of every deck used on this device.</li>",
        "<li><b>Importer</b> (Import): reloads an exported file (for example on a new phone), after confirmation. With a backup of all decks, a list of tick boxes lets you restore only some of them.</li>",
        "<li><b>Réinitialiser</b> (or <b>Réinitialiser ce paquet</b>, Reset this deck): sets your card selection and your review progress back to zero for the open deck; other decks are not affected. The deck's content is not stored on your device, so it is not affected either.</li></ul>",
        "<div class='notice'><b>Safety.</b> A backup of one deck can only be imported into that same deck. If you pick the file of another deck by mistake, the app refuses it with a message and changes nothing. To restore another deck, open it first (Réglages → Paquet de cartes).</div>",
        "<p><b>Tip.</b> Export your progress from time to time, and always before changing phone or clearing your browser data.</p>",
        "<h3>When could my progress disappear?</h3>",
        "<p>Your progress is saved in your browser, on your device. It does not disappear with a usual system update, but it can be lost in these situations:</p>",
        "<ul><li><b>A long break on iPhone or iPad:</b> if you do not open Vocalésia for a long time (a week or more of Safari use, for example over the holidays), Safari may delete the site's data. Adding Vocalésia to your home screen reduces this risk.</li>",
        "<li><b>Cleaning your browser:</b> “clear website data”, a cleaning app or reinstalling the browser deletes everything.</li>",
        "<li><b>A nearly full phone:</b> the system may free up space by deleting data from rarely used sites.</li>",
        "<li><b>Another device or another browser:</b> your progress does not follow you; you have to export it and import it.</li>",
        "<li><b>Private browsing:</b> everything disappears when you close the window.</li></ul>",
        "<div class='notice'><b>Do this before a long break, a change of phone or a clean-up.</b> Go to Réglages (Settings) and export your progress, then keep the file (in your documents, or email it to yourself). You can import it again if needed.</div>"] },
      { id: 'conseils', t: '8. Tips for effective memorising', h: [
        "<ul><li>Review <b>a little every day</b> (5 to 10 minutes) rather than a long time now and then.</li>",
        "<li>Do not select too many cards at once: add them as the lessons go by.</li>",
        "<li>Rate yourself honestly: being too generous with « Facile » (Easy) spaces out the reviews too much.</li>",
        "<li>Do not use private browsing and do not clear the site's data: you would lose your progress.</li></ul>"] },
      { id: 'problemes', t: '9. If something goes wrong', h: [
        "<table><tr><th>Problem</th><th>What to do</th></tr>",
        "<tr><td>I can't hear anything</td><td>Check your phone's volume and that it is not in silent mode. Go to « Réglages » and tap « Tester la voix » (Test the voice).</td></tr>",
        "<tr><td>The app says no French voice was found</td><td>Install a French voice in your device settings (accessibility or speech), then reload the page.</td></tr>",
        "<tr><td>I don't see the new cards</td><td>Reload the page. Wait a few minutes if your teacher has just published them.</td></tr>",
        "<tr><td>My progress has disappeared</td><td>You may be using another browser or device, or the browser data may have been cleared. Import your latest backup (section 7).</td></tr>",
        "<tr><td>A message says my progress cannot be saved</td><td>You are probably in private browsing. Open the app in a normal tab.</td></tr>",
        "<tr><td>The page is empty or shows an error</td><td>Tell your teacher: the card file needs to be checked.</td></tr></table>"] }
    ]
  }
};

function demarrer() {
  'use strict';
  if (typeof document === 'undefined') return;

  var Core = window.Core;
  var PAQUET = window.PAQUET || { id: 'paquet', titre: 'Vocabulaire', version: 0, cartes: [] };
  var KEY = 'flashcards.' + (PAQUET.id || 'paquet') + '.v1';
  var byId = {};
  PAQUET.cartes.forEach(function (c) { byId[c.id] = c; });
  var allIds = PAQUET.cartes.map(function (c) { return c.id; });

  var storageOK = true;
  function defaults() {
    return {
      selected: {}, cards: {}, known: [], highlight: [], highlightSeen: true, collapsed: {},
      settings: { newPerDay: 10, rate: 0.9, voice: '', autoplay: true, tracking: 'single' },
      newToday: { day: 0, count: 0 }
    };
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var o = JSON.parse(raw), d = defaults();
        return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) });
      }
    } catch (e) { storageOK = false; }
    var d2 = defaults();
    d2.known = allIds.slice();     // premier lancement : rien n'est signalé « nouveau »
    return d2;
  }
  var store = load();
  function save() {
    try { store.titre = PAQUET.titre; localStorage.setItem(KEY, JSON.stringify(store)); }
    catch (e) { if (storageOK) { storageOK = false; showWarn(); } }
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  function $(s) { return document.querySelector(s); }
  function h(tag, attrs) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
      else if (v === true) e.setAttribute(k, '');
      else if (v !== false && v != null) e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) { if (c != null && c !== false) e.append(c); });
    }
    return e;
  }

  function showWarn() {
    var w = $('#warn');
    w.replaceChildren();
    if (!storageOK) w.append(h('div', { class: 'notice' },
      "Ton navigateur ne permet pas d'enregistrer ta progression (navigation privée ?). Ouvre cette page dans un onglet normal."));
    if (window.__erreurPaquets) w.append(h('div', { class: 'notice' },
      'Le fichier paquets.js contient une erreur (souvent une virgule oubliée entre deux paquets) : la liste des paquets est ignorée et seul cartes.js est chargé.'));
  }

  /* ---------------- Synthèse vocale ---------------- */
  var voices = [], allFr = [], currentAudio = null;
  function refreshVoices() {
    if (!('speechSynthesis' in window)) return;
    allFr = speechSynthesis.getVoices().filter(function (v) { return /^fr/i.test(v.lang); });
    // Certains navigateurs (macOS notamment) listent la même voix plusieurs fois : on n'en garde qu'une dans le menu
    var seen = {};
    voices = allFr.filter(function (v) {
      var k = v.name + '|' + v.lang;
      if (seen[k]) return false;
      seen[k] = true; return true;
    });
  }
  if ('speechSynthesis' in window) {
    refreshVoices();
    speechSynthesis.onvoiceschanged = function () { refreshVoices(); if (!$('#view-settings').hidden) renderSettings(); };
  }
  function pickVoice() {
    if (store.settings.voice) {
      var v = allFr.find(function (x) { return x.voiceURI === store.settings.voice; });
      if (v) return v;
    }
    return voices.find(function (x) { return /fr[-_]FR/i.test(x.lang); }) || voices[0] || null;
  }
  function speak(text, audioUrl) {
    try {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      if (audioUrl) { currentAudio = new Audio(audioUrl); currentAudio.play().catch(function () {}); return; }
      if (!('speechSynthesis' in window)) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'fr-FR';
      var v = pickVoice(); if (v) u.voice = v;
      u.rate = Number(store.settings.rate) || 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function speakBtn(text, audioUrl, cls) {
    return h('button', { class: cls || 'speak', type: 'button', 'aria-label': 'Écouter', onclick: function (ev) { ev.stopPropagation(); speak(text, audioUrl); } }, '🔊');
  }

  /* ---------------- Navigation ---------------- */
  var tabs = ['review', 'cards', 'settings', 'help'];

  // ----- Aide (français / English) avec sommaire cliquable -----
  var aideLang = (function () {
    try { var l = localStorage.getItem('vocalesia.aide.lang'); if (l === 'fr' || l === 'en') return l; } catch (e) {}
    return 'fr';
  })();
  function renderHelp() {
    var box = $('#view-help'), A = AIDE[aideLang];
    box.replaceChildren();
    var wrap = h('div', { class: 'help', lang: aideLang });
    function go(id) {
      var el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function langBtn(l, label) {
      return h('button', { class: l === aideLang ? 'primary' : 'secondary', type: 'button', lang: l, 'aria-pressed': l === aideLang ? 'true' : 'false',
        onclick: function () {
          aideLang = l;
          try { localStorage.setItem('vocalesia.aide.lang', l); } catch (e) {}
          renderHelp(); window.scrollTo(0, 0);
        } }, label);
    }
    wrap.append(h('div', { class: 'btnrow', id: 'aide-top' }, langBtn('fr', 'Français'), langBtn('en', 'English')));
    var intro = h('p', { class: 'intro' }); intro.innerHTML = A.intro; wrap.append(intro);
    var list = h('ul', { class: 'toc' });
    A.sections.forEach(function (sec) {
      list.append(h('li', {}, h('a', { href: '#aide-' + sec.id, onclick: function (e) { e.preventDefault(); go('aide-' + sec.id); } }, sec.t)));
    });
    wrap.append(h('div', { class: 'panel' }, h('h2', { style: 'margin-top:0' }, A.sommaire), h('div', { role: 'navigation', 'aria-label': A.sommaire }, list)));
    A.sections.forEach(function (sec) {
      var body = h('div'); body.innerHTML = sec.h.join('');
      wrap.append(h('section', { id: 'aide-' + sec.id }, h('h2', {}, sec.t), body,
        h('a', { class: 'toplink', href: '#aide-top', onclick: function (e) { e.preventDefault(); go('aide-top'); } }, A.haut)));
    });
    box.append(wrap);
  }

  function showTab(name) {
    tabs.forEach(function (t) {
      $('#tab-' + t).setAttribute('aria-selected', t === name ? 'true' : 'false');
      $('#view-' + t).hidden = (t !== name);
    });
    if (name === 'review') renderReview();
    if (name === 'cards') renderCards();
    if (name === 'settings') renderSettings();
    if (name === 'help') renderHelp();
  }
  tabs.forEach(function (t) { $('#tab-' + t).addEventListener('click', function () { showTab(t); }); });

  // Nouveautés : à chaque ajout de cartes par le professeur, elles (et leur leçon) passent en rouge
  // et le restent jusqu'au prochain ajout. Le badge, lui, disparaît dès que l'élève a ouvert « Cartes ».
  function syncNew() {
    var fresh = allIds.filter(function (id) { return store.known.indexOf(id) < 0; });
    if (fresh.length) {
      store.highlight = fresh;
      store.highlightSeen = false;
      store.known = store.known.concat(fresh);
    }
  }
  function highlightIds() { return (store.highlight || []).filter(function (id) { return byId[id]; }); }
  function unseenCount() { return store.highlightSeen ? 0 : highlightIds().length; }
  function updateBadge() {
    var n = unseenCount(), b = $('#badge');
    b.hidden = n === 0; b.textContent = n;
  }

  /* ---------------- Révision ---------------- */
  var session = null;

  function selectedIds() { return allIds.filter(function (id) { return store.selected[id]; }); }
  function separate() { return store.settings.tracking === 'separate'; }
  // Une « unité » = ce qui est planifié : le mot (suivi unique) ou le couple mot + type d'exercice (suivi séparé).
  function unitsFor(id) { return separate() ? [id + '|1', id + '|2'] : [id]; }
  function hasMode(id, mode) { return mode === 1 || !!(byId[id] && byId[id].definition); }
  function unitState(id) {   // état le plus prudent d'un mot (pour l'affichage)
    var best = null;
    unitsFor(id).forEach(function (k) {
      var s = store.cards[k];
      if (s && (!best || s.due < best.due)) best = s;
    });
    return best;
  }
  function allUnitStates() {
    var out = [];
    selectedIds().forEach(function (id) {
      unitsFor(id).forEach(function (k) { if (store.cards[k]) out.push(store.cards[k]); });
    });
    return out;
  }
  function pickMode(id) {
    return (hasMode(id, 2) && Math.random() < 0.5) ? 2 : 1;   // 1 = écoute → écrit ; 2 = définition → mot
  }
  function dueItems(today) {
    var out = [];
    selectedIds().forEach(function (id) {
      unitsFor(id).forEach(function (k) {
        var s = store.cards[k];
        if (!s || s.due > today) return;
        var mode = separate() ? Number(k.split('|')[1]) : pickMode(id);
        if (hasMode(id, mode)) out.push({ id: id, key: k, mode: mode });
      });
    });
    return out;
  }
  function newWordIds() {
    return selectedIds().filter(function (id) { return !unitsFor(id).some(function (k) { return store.cards[k]; }); });
  }
  function newAllowed(today) {
    var used = store.newToday.day === today ? store.newToday.count : 0;
    return Math.max(0, Number(store.settings.newPerDay) - used);
  }
  function counts() {
    var today = Core.dayNumber();
    return { sel: selectedIds().length, due: dueItems(today).length, fresh: Math.min(newWordIds().length, newAllowed(today)) };
  }
  function startSession() {
    var today = Core.dayNumber();
    var items = dueItems(today);
    newWordIds().slice(0, newAllowed(today)).forEach(function (id) {
      var m = pickMode(id);
      items.push({ id: id, mode: m, key: separate() ? id + '|' + m : id });
    });
    items = Core.shuffle(items);
    session = { queue: items, total: items.length, done: 0, revealed: false, hint: false };
    renderReview();
  }

  function rate(q) {
    var item = session.queue.shift(), today = Core.dayNumber(), prev = store.cards[item.key];
    var isNew = !unitsFor(item.id).some(function (k) { return store.cards[k]; });
    if (isNew) {
      if (store.newToday.day !== today) store.newToday = { day: today, count: 0 };
      store.newToday.count++;
    }
    store.cards[item.key] = Core.schedule(prev, q, today);
    if (separate()) {
      // l'autre type d'exercice sera proposé dès le lendemain
      var otherMode = item.mode === 1 ? 2 : 1, other = item.id + '|' + otherMode;
      if (hasMode(item.id, otherMode) && !store.cards[other]) {
        store.cards[other] = { reps: 0, ef: 2.5, ivl: 0, lapses: 0, due: today + 1, ph: true };
      }
    }
    if (q === 0) {
      if (!separate()) item.mode = (item.mode === 1 && hasMode(item.id, 2)) ? 2 : 1;   // on change d'angle d'attaque
      session.queue.splice(Math.min(session.queue.length, 3), 0, item);
    } else {
      session.done++;
    }
    save();
    session.revealed = false;
    session.hint = false;
    renderReview();
  }

  function renderReview() {
    var box = $('#view-review');
    box.replaceChildren();
    updateBadge();
    var c = counts(), fresh = store.highlightSeen ? [] : highlightIds();

    if (!session || (session.queue.length === 0 && session.total === 0)) {
      if (fresh.length) {
        box.append(h('div', { class: 'notice' },
          fresh.length + (fresh.length > 1 ? ' nouvelles cartes ont été ajoutées' : ' nouvelle carte a été ajoutée') + ' par ton professeur. ',
          h('a', { href: '#', onclick: function (e) { e.preventDefault(); showTab('cards'); } }, 'Voir les cartes')));
      }
      if (stopped) { box.append(h('div', { class: 'notice' }, 'Séance terminée. Ta progression est enregistrée ; les cartes non faites te seront reproposées.')); stopped = false; }
      box.append(h('div', { class: 'panel' },
        h('h2', {}, "Aujourd'hui"),
        h('div', { class: 'stats' },
          h('div', { class: 'stat' }, h('b', {}, String(c.due)), 'à revoir'),
          h('div', { class: 'stat' }, h('b', {}, String(c.fresh)), 'nouvelles')),
        c.sel === 0
          ? h('p', { class: 'muted' }, "Tu n'as encore choisi aucune carte. Va dans l'onglet « Cartes » pour sélectionner les mots que tu veux mémoriser.")
          : null,
        h('button', { class: 'primary', type: 'button', disabled: (c.due + c.fresh) === 0, onclick: startSession },
          (c.due + c.fresh) === 0 ? (c.sel === 0 ? 'Aucune carte sélectionnée' : "Rien à réviser pour l'instant") : 'Commencer')
      ));
      if (c.sel > 0 && c.due + c.fresh === 0) box.append(nextDueNote());
      return;
    }

    if (session.queue.length === 0) {
      session = null;
      box.append(h('div', { class: 'panel' },
        h('h2', {}, 'Bravo, c’est terminé pour le moment ! 🎉'),
        nextDueNote()),
        h('button', { class: 'primary', type: 'button', onclick: function () { renderReview(); } }, 'Retour'));
      return;
    }

    var item = session.queue[0], card = byId[item.id], prev = store.cards[item.key], today = Core.dayNumber();
    var pct = Math.round(100 * session.done / Math.max(1, session.total));
    box.append(
      h('div', { class: 'progress' }, h('i', { style: 'width:' + pct + '%' })),
      h('div', { class: 'toprow' },
        h('span', { class: 'muted small' }, session.done + ' / ' + session.total + ' · reste ' + session.queue.length),
        h('button', { class: 'secondary small', type: 'button', onclick: stopSession }, 'Terminer')),
      cardView(card, item, session.revealed));

    if (!session.revealed) {
      box.append(h('button', { class: 'primary', type: 'button', onclick: reveal }, 'Afficher la réponse'));
      if (item.mode === 1 && store.settings.autoplay) speak(card.mot, card.audio);
    } else {
      var names = ['Encore', 'Difficile', 'Bien', 'Facile'];
      var rates = h('div', { class: 'rates' });
      names.forEach(function (n, q) {
        var s = Core.schedule(prev, q, today);
        rates.append(h('button', { class: 'r' + q, type: 'button', onclick: function () { rate(q); } },
          n, h('small', {}, q === 0 ? 'bientôt' : Core.labelInterval(s.ivl))));
      });
      box.append(rates);
      if (item.mode === 2 && store.settings.autoplay) speak(card.mot, card.audio);
    }
  }

  function reveal() { session.revealed = true; renderReview(); }

  var stopped = false;
  function stopSession() {
    try { if ('speechSynthesis' in window) speechSynthesis.cancel(); if (currentAudio) currentAudio.pause(); } catch (e) {}
    session = null;
    stopped = true;      // la progression est déjà enregistrée carte après carte
    renderReview();
  }

  function nextDueNote() {
    var today = Core.dayNumber(), next = Infinity, states = allUnitStates();
    states.forEach(function (s) { if (s.due > today && s.due < next) next = s.due; });
    if (next === Infinity) return h('p', { class: 'muted' }, '');
    var n = states.filter(function (s) { return s.due === next; }).length;
    var when = next - today === 1 ? 'demain' : 'dans ' + (next - today) + ' jours';
    return h('p', { class: 'muted' }, 'Prochaine révision ' + when + ' (' + n + (n > 1 ? ' cartes' : ' carte') + ').');
  }

  // Phrases d'exemple : le mot à trouver (ou sa forme fléchie / conjuguée) est écrit entre crochets dans
  // cartes.js, par exemple « Nous avons [emménagé] en septembre. ». Les crochets ne sont jamais affichés
  // ni lus à voix haute.
  function stripBrackets(t) { return t.replace(/\[([^\]]+)\]/g, '$1'); }
  function clozeIndex(ex) {
    for (var i = 0; i < ex.length; i++) if (/\[[^\]]+\]/.test(ex[i])) return i;
    return -1;
  }
  // mode 'blank' : le mot entre crochets est remplacé par un blanc ; mode 'fill' : il est mis en valeur
  function sentence(t, mode) {
    var out = [], last = 0, m, re = /\[([^\]]+)\]/g;
    while ((m = re.exec(t)) !== null) {
      if (m.index > last) out.push(t.slice(last, m.index));
      out.push(mode === 'blank'
        ? h('span', { class: 'blank', role: 'img', 'aria-label': 'mot à trouver' }, ' ')
        : h('b', { class: 'hl' }, m[1]));
      last = m.index + m[0].length;
    }
    if (last < t.length) out.push(t.slice(last));
    return out;
  }
  function exampleList(ex, skip) {
    var items = ex.filter(function (t, i) { return i !== skip; });
    if (!items.length) return null;
    return h('ul', { class: 'examples' }, items.map(function (t) {
      return h('li', {}, speakBtn(stripBrackets(t)), h('span', {}, sentence(t, 'fill')));
    }));
  }

  // Affichage du mot : « mot* » pour un mot familier (l'astérisque n'est jamais prononcé)
  function motAff(c) { return c.familier ? c.mot + '*' : c.mot; }
  function noteFam(c) { return c.familier ? h('p', { class: 'indice' }, '* registre familier') : null; }
  function indiceTxt(c) { return c.indice ? h('p', { class: 'indice' }, 'Indice : ' + c.indice) : null; }

  // Ajoute des éléments en ignorant les valeurs vides (null) : sinon le navigateur écrirait « null »
  function put(el) {
    for (var i = 1; i < arguments.length; i++) {
      [].concat(arguments[i]).forEach(function (c) { if (c != null && c !== false) el.append(c); });
    }
  }

  function cardView(card, item, revealed) {
    var el = h('div', { class: 'card' });
    var ex = card.exemples || [];
    if (item.mode === 1) {
      put(el, h('p', { class: 'label' }, 'Écoute le mot'));
      if (!revealed) {
        var hintWord = h('div', { class: 'word', id: 'hintword', hidden: !session.hint }, motAff(card));
        var cb = h('input', { type: 'checkbox', id: 'hint' });
        cb.checked = !!session.hint;
        cb.addEventListener('change', function () { session.hint = cb.checked; hintWord.hidden = !cb.checked; });
        put(el, speakBtn(card.mot, card.audio, 'bigspeak'), hintWord, indiceTxt(card),
          h('p', { class: 'muted' }, 'Quel est ce mot ? Que veut-il dire ?'),
          h('label', { class: 'hintbox small' }, cb, "Je n'ai pas bien compris le mot : afficher l'écrit"));
      } else {
        put(el, h('div', { class: 'word' }, motAff(card)), speakBtn(card.mot, card.audio), indiceTxt(card), noteFam(card),
          h('hr', { class: 'sep' }),
          card.definition ? h('p', { class: 'def' }, card.definition) : null,
          exampleList(ex, -1));
      }
    } else {
      var ci = clozeIndex(ex);          // première phrase contenant un mot entre crochets (-1 : aucune)
      put(el, h('p', { class: 'label' }, 'Quel est le mot ?'), h('p', { class: 'def' }, card.definition));
      if (ci >= 0) {
        if (!revealed) {
          put(el, h('p', { class: 'cloze-label' }, 'Complète la phrase :'),
            h('p', { class: 'cloze' }, sentence(ex[ci], 'blank')));
        } else {
          put(el, h('div', { class: 'cloze-row' }, speakBtn(stripBrackets(ex[ci])), h('span', {}, sentence(ex[ci], 'fill'))));
        }
      }
      if (revealed) {
        put(el, h('hr', { class: 'sep' }),
          h('div', { class: 'word' }, motAff(card)), speakBtn(card.mot, card.audio), noteFam(card),
          exampleList(ex, ci));
      }
    }
    return el;
  }

  /* ---------------- Liste des cartes ---------------- */
  function renderCards() {
    var box = $('#view-cards');
    box.replaceChildren();
    var hl = {};
    highlightIds().forEach(function (id) { hl[id] = true; });
    var today = Core.dayNumber();

    var groups = [], idx = {};
    PAQUET.cartes.forEach(function (c) {
      var g = c.lecon || 'Cartes';
      if (!(g in idx)) { idx[g] = groups.length; groups.push({ name: g, ids: [] }); }
      groups[idx[g]].ids.push(c.id);
    });

    var dets = [];
    var collapseAll = h('input', { type: 'checkbox' });
    function syncCollapseAll() {
      collapseAll.checked = dets.length > 0 && dets.every(function (x) { return !x.det.open; });
    }
    function remember(name, open) {
      if (open) delete store.collapsed[name]; else store.collapsed[name] = true;
    }
    collapseAll.addEventListener('change', function () {
      dets.forEach(function (x) { x.det.open = !collapseAll.checked; remember(x.name, x.det.open); });
      save();
    });
    box.append(
      h('p', { class: 'muted small' }, 'Coche les mots que tu veux mémoriser : ils te seront proposés régulièrement.'),
      h('label', { class: 'hintbox small' }, collapseAll, 'Tout réduire'));

    groups.forEach(function (g) {
      var det = h('details', {});
      det.open = !store.collapsed[g.name];
      var lessonCb = h('input', { type: 'checkbox', 'aria-label': 'Tout sélectionner : ' + g.name });
      var count = h('span', { class: 'count' });
      var boxes = [];
      var lessonIsNew = g.ids.some(function (id) { return hl[id]; });
      function refreshHead() {
        var n = g.ids.filter(function (id) { return store.selected[id]; }).length;
        count.textContent = n + ' / ' + g.ids.length;
        lessonCb.checked = n === g.ids.length;
        lessonCb.indeterminate = n > 0 && n < g.ids.length;
      }
      lessonCb.addEventListener('click', function (e) { e.stopPropagation(); });
      lessonCb.addEventListener('change', function () {
        g.ids.forEach(function (id) { store.selected[id] = lessonCb.checked; });
        boxes.forEach(function (b) { b.checked = lessonCb.checked; });
        save(); refreshHead();
      });
      det.addEventListener('toggle', function () { remember(g.name, det.open); save(); syncCollapseAll(); });
      det.append(h('summary', {},
        h('span', { class: 'tri', 'aria-hidden': 'true' }), lessonCb,
        h('span', { class: lessonIsNew ? 'fresh' : '' }, g.name), count));
      g.ids.forEach(function (id) {
        var c = byId[id], s = unitState(id);
        var cb = h('input', { type: 'checkbox' });
        cb.checked = !!store.selected[id];
        cb.addEventListener('change', function () { store.selected[id] = cb.checked; save(); refreshHead(); });
        boxes.push(cb);
        var chip = null;
        if (hl[id]) chip = h('span', { class: 'chip new' }, 'Nouveau');
        else if (s) {
          var d = s.due - today;
          chip = h('span', { class: 'chip' }, d <= 0 ? 'À revoir' : (d === 1 ? 'Demain' : 'Dans ' + d + ' j'));
        }
        det.append(h('div', { class: 'row' },
          h('label', {}, cb, h('span', { class: 't' }, h('span', { class: hl[id] ? 'fresh' : '' }, motAff(c)), c.indice ? h('span', { class: 'indice' }, ' (' + c.indice + ')') : null, chip)),
          speakBtn(c.mot, c.audio)));
      });
      refreshHead();
      dets.push({ det: det, name: g.name });
      box.append(det);
    });

    syncCollapseAll();
    store.highlightSeen = true;     // le badge disparaît ; le rouge, lui, reste jusqu'au prochain ajout
    save(); updateBadge();
  }

    if (window.LISTE_PAQUETS && window.LISTE_PAQUETS.length > 1) {
      var deckSel = h('select', {});
      window.LISTE_PAQUETS.forEach(function (p) { deckSel.append(h('option', { value: p.fichier }, p.titre || p.fichier)); });
      deckSel.value = window.PAQUET_FICHIER || '';
      deckSel.addEventListener('change', function () { window.vocalesiaChoisir(deckSel.value); });
      box.append(h('div', { class: 'panel' },
        h('h2', {}, 'Paquet de cartes'),
        h('div', { class: 'field' }, h('label', {}, 'Paquet actuel'), deckSel),
        h('p', { class: 'muted small' }, 'Chaque paquet a sa propre progression : en changer ne fait rien perdre.')));
    }
    box.append(h('div', { class: 'panel' },
      h('h2', {}, 'Révision'),
      h('div', { class: 'field' }, h('label', {}, 'Nouvelles cartes par jour'), newPer),
      h('div', { class: 'field' }, h('label', {}, 'Lecture audio automatique'), auto),
      h('div', { class: 'field' }, h('label', {}, 'Suivi des cartes'), trk),
      h('p', { class: 'muted small' }, "Un seul suivi : un mot = une révision, quel que soit l'exercice. Suivi séparé : l'écoute et la définition sont planifiées chacune de leur côté (environ deux fois plus de révisions).")));

    box.append(h('div', { class: 'panel' },
      h('h2', {}, 'Voix'),
      ('speechSynthesis' in window)
        ? (voices.length ? null : h('div', { class: 'notice' }, "Aucune voix française n'a été trouvée sur cet appareil. Installe-en une dans les réglages d'accessibilité/langue de ton téléphone ou de ton ordinateur."))
        : h('div', { class: 'notice' }, "Ce navigateur ne sait pas lire le texte à voix haute."),
      h('div', { class: 'field' }, h('label', {}, 'Voix'), voiceSel),
      h('div', { class: 'field' }, h('label', {}, 'Vitesse'), rate),
      h('div', { class: 'btnrow' }, h('button', { class: 'secondary', type: 'button', onclick: function () { speak('Bonjour, voici un exemple de voix.'); } }, '🔊 Tester la voix'))));

    var importBox = h('div', {});
    var file = h('input', { type: 'file', accept: 'application/json,.json', hidden: true });
    function refus(titre) {
      alert('Cette sauvegarde est celle du paquet « ' + (titre || 'un autre paquet') + ' », pas de « ' + PAQUET.titre + ' ». ' +
            "Ouvre d'abord ce paquet (Réglages → Paquet de cartes), puis importe-la là. Rien n'a été modifié.");
    }
    file.addEventListener('change', function () {
      var f = file.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        importBox.replaceChildren();
        var o;
        try { o = JSON.parse(String(r.result)); } catch (e) { o = null; }
        try {
          if (o && o.format === 'vocalesia-tous' && o.jeux && typeof o.jeux === 'object') {
            var ids = Object.keys(o.jeux).filter(function (id) { return validStore(o.jeux[id].data); });
            if (!ids.length) throw new Error('vide');
            var boxes = {};
            importBox.append(h('p', { class: 'small' }, 'Cette sauvegarde contient plusieurs paquets. Coche ceux que tu veux restaurer :'));
            ids.forEach(function (id) {
              var cb = h('input', { type: 'checkbox' }); cb.checked = true; boxes[id] = cb;
              importBox.append(h('label', { class: 'hintbox small', style: 'display:flex' }, cb,
                (o.jeux[id].titre || id) + (id === PAQUET.id ? ' (paquet ouvert)' : '')));
            });
            importBox.append(h('div', { class: 'btnrow' }, h('button', { class: 'secondary', type: 'button', onclick: function () {
              var chosen = ids.filter(function (id) { return boxes[id].checked; });
              if (!chosen.length) return;
              if (!confirm('Remplacer la progression de ' + chosen.length + (chosen.length > 1 ? ' paquets' : ' paquet') + ' par celle de la sauvegarde ?')) return;
              chosen.forEach(function (id) {
                if (id === PAQUET.id) restoreCurrent(o.jeux[id].data); else restoreOther(id, o.jeux[id].data);
              });
              renderSettings(); alert('Progression restaurée.');
            } }, 'Restaurer les paquets cochés')));
            return;
          }
          var data = o && o.format === 'vocalesia' && o.data ? o.data : o;
          if (!validStore(data)) throw new Error('format');
          if (o.format === 'vocalesia' && o.paquet && o.paquet !== PAQUET.id) { refus(o.titre); return; }
          if (o.format !== 'vocalesia' && !looksLikeThisDeck(data)) { refus(null); return; }
          if (!confirm('Remplacer ta progression actuelle par celle de la sauvegarde ?')) return;
          restoreCurrent(data);
          renderSettings(); alert('Progression restaurée.');
        } catch (e) { alert("Ce fichier n'est pas une sauvegarde valide."); }
      };
      r.readAsText(f);
      file.value = '';
    });
    var multi = (window.LISTE_PAQUETS && window.LISTE_PAQUETS.length > 1);
    box.append(h('div', { class: 'panel' },
      h('h2', {}, 'Sauvegarde de ma progression'),
      h('p', { class: 'muted small' }, "Ta progression reste sur cet appareil. Pour la conserver en cas de changement de téléphone ou pour la copier sur un autre appareil, exporte-la puis importe-la là-bas."
        + (multi ? " « Exporter ce paquet » ne sauvegarde que le paquet ouvert ; « Exporter tous les paquets » les sauvegarde tous dans un seul fichier, dont tu choisis à l'import les paquets à restaurer. Une sauvegarde d'un paquet ne peut être importée que dans ce même paquet." : '')),
      h('div', { class: 'btnrow' },
        h('button', { class: 'secondary', type: 'button', onclick: exportData }, multi ? '⬇️ Exporter ce paquet' : '⬇️ Exporter'),
        multi ? h('button', { class: 'secondary', type: 'button', onclick: exportAll }, '⬇️ Exporter tous les paquets') : null,
        h('button', { class: 'secondary', type: 'button', onclick: function () { file.click(); } }, '⬆️ Importer'),
        h('button', { class: 'secondary', type: 'button', onclick: resetAll }, multi ? 'Réinitialiser ce paquet' : 'Réinitialiser'),
        file),
      importBox));

    box.append(h('p', { class: 'muted small' }, 'Paquet : ' + PAQUET.titre + ' · version ' + PAQUET.version + ' · ' + PAQUET.cartes.length + ' cartes'));
  }

  function changeTracking(mode, sel) {
    var prevMode = store.settings.tracking === 'separate' ? 'separate' : 'single';
    if (mode === prevMode) return;
    var msg = mode === 'separate'
      ? "Chaque mot sera suivi séparément pour chaque type d'exercice. Les mots déjà appris gardent leur intervalle actuel pour les deux types, et le nombre de révisions augmentera progressivement. Continuer ?"
      : "Pour chaque mot, l'intervalle le plus court des deux types d'exercice sera conservé. Continuer ?";
    if (!confirm(msg)) { sel.value = prevMode; return; }
    var cards = store.cards, out = {};
    if (mode === 'separate') {
      Object.keys(cards).forEach(function (k) {
        if (k.indexOf('|') >= 0) { out[k] = cards[k]; return; }
        out[k + '|1'] = Object.assign({}, cards[k]);
        if (hasMode(k, 2)) out[k + '|2'] = Object.assign({}, cards[k]);
      });
    } else {
      var ids = {};
      Object.keys(cards).forEach(function (k) { ids[k.split('|')[0]] = true; });
      Object.keys(ids).forEach(function (id) {
        var cand = [cards[id], cards[id + '|1'], cards[id + '|2']].filter(Boolean);
        var real = cand.filter(function (x) { return !x.ph; });
        if (real.length) cand = real;
        if (!cand.length) return;
        cand.sort(function (a, b) { return a.due - b.due || a.ivl - b.ivl; });
        var merged = Object.assign({}, cand[0]); delete merged.ph;
        out[id] = merged;
      });
    }
    store.cards = out;
    store.settings.tracking = mode;
    session = null;
    save();
    renderSettings();
  }

  function download(name, obj) {
    var blob = new Blob([JSON.stringify(obj)], { type: 'application/json' });
    var a = h('a', { href: URL.createObjectURL(blob), download: name });
    document.body.append(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function exportData() {
    download('ma-progression-' + (PAQUET.id || 'paquet') + '.json',
      { format: 'vocalesia', paquet: PAQUET.id, titre: PAQUET.titre, data: store });
  }
  // Tous les paquets dont ce navigateur garde une progression, y compris le paquet ouvert.
  function allStores() {
    var out = {};
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var m = /^flashcards\.(.+)\.v1$/.exec(localStorage.key(i) || '');
        if (!m) continue;
        var d = JSON.parse(localStorage.getItem(m[0]));
        if (d && typeof d === 'object') out[m[1]] = { titre: d.titre || null, data: d };
      }
    } catch (e) {}
    out[PAQUET.id] = { titre: PAQUET.titre, data: store };
    return out;
  }
  function exportAll() {
    download('ma-progression-tous-les-paquets.json', { format: 'vocalesia-tous', jeux: allStores() });
  }
  function validStore(o) { return !!o && typeof o === 'object' && !!o.cards && typeof o.cards === 'object' && !!o.selected && typeof o.selected === 'object'; }
  function restoreCurrent(o) {
    var d = defaults();
    store = Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) });
    if (!Array.isArray(store.known) || !store.known.length) store.known = allIds.slice();
    syncNew();
    save(); session = null;
  }
  function restoreOther(id, o) {
    try { localStorage.setItem('flashcards.' + id + '.v1', JSON.stringify(o)); } catch (e) {}
  }
  // Une sauvegarde ancienne (sans identifiant de paquet) est reconnue à ses cartes.
  function looksLikeThisDeck(o) {
    var ids = {};
    Object.keys(o.cards).concat(Object.keys(o.selected)).forEach(function (k) { ids[k.split('|')[0]] = true; });
    var list = Object.keys(ids);
    return list.length === 0 || list.some(function (k) { return byId[k]; });
  }
  function resetAll() {
    var multi = window.LISTE_PAQUETS && window.LISTE_PAQUETS.length > 1;
    if (!confirm('Réinitialiser' + (multi ? ' ce paquet' : '') + ' ? Ta sélection de cartes et ton avancement dans les révisions seront remis à zéro'
      + (multi ? ' (les autres paquets ne sont pas touchés)' : '') + '.')) return;
    try { localStorage.removeItem(KEY); } catch (e) {}
    store = defaults(); store.known = allIds.slice(); session = null;
    renderSettings();
  }

  /* ---------------- Clavier (ordinateur) ---------------- */
  document.addEventListener('keydown', function (e) {
    if ($('#view-review').hidden || !session || !session.queue.length) return;
    var tag = (e.target && e.target.tagName) || '';
    if (/INPUT|SELECT|TEXTAREA/.test(tag)) return;
    if (!session.revealed && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); reveal(); }
    else if (session.revealed && /^[1-4]$/.test(e.key)) rate(Number(e.key) - 1);
    else if (e.key === 'Escape') stopSession();
    else if (e.key === 'r' || e.key === 'R') speak(byId[session.queue[0].id].mot, byId[session.queue[0].id].audio);
  });

  /* ---------------- Démarrage ---------------- */
  $('#title').textContent = PAQUET.titre;
  document.title = 'Vocalésia';
  syncNew();
  save();
  showWarn();
  showTab('review');
}

/* ===================================================================
 *  3) Choix du paquet de cartes
 *     paquets.js déclare la liste des paquets ; chaque paquet est un fichier (cartes.js, …) qui définit
 *     window.PAQUET. Le dernier paquet utilisé est rouvert automatiquement ; on peut en changer dans
 *     Réglages. Sans paquets.js, l'application charge simplement cartes.js.
 * =================================================================== */
(function () {
  var LS = 'vocalesia.dernier';
  var liste = (Array.isArray(window.LISTE_PAQUETS) && window.LISTE_PAQUETS.length)
    ? window.LISTE_PAQUETS : [{ fichier: 'cartes.js', titre: 'Vocabulaire' }];
  // fichier présent mais illisible (erreur de syntaxe) : il se charge sans définir la liste
  if (window.__paquetsLu && !(Array.isArray(window.LISTE_PAQUETS) && window.LISTE_PAQUETS.length)) window.__erreurPaquets = 'erreur de syntaxe';
  window.LISTE_PAQUETS = liste;
  function lire() { try { return localStorage.getItem(LS) || ''; } catch (e) { return ''; } }
  function ecrire(f) { try { localStorage.setItem(LS, f); } catch (e) {} }
  window.vocalesiaChoisir = function (f) { ecrire(f); location.reload(); };

  function choisir(msg) {
    document.querySelector('nav').hidden = true;
    document.querySelector('#view-review').hidden = true;
    document.querySelector('#title').textContent = 'Choisis un paquet de cartes';
    var box = document.querySelector('#view-choice');
    box.hidden = false;
    box.replaceChildren();
    if (msg) { var n = document.createElement('div'); n.className = 'notice'; n.textContent = msg; box.append(n); }
    var panel = document.createElement('div'); panel.className = 'panel';
    liste.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'primary'; b.style.marginBottom = '10px';
      b.textContent = p.titre || p.fichier;
      b.addEventListener('click', function () { window.vocalesiaChoisir(p.fichier); });
      panel.append(b);
    });
    box.append(panel);
  }

  function charger(f) {
    window.PAQUET_FICHIER = f;
    var sc = document.createElement('script');
    sc.src = f;
    sc.onload = demarrer;
    sc.onerror = function () { ecrire(''); choisir('Le paquet « ' + f + " » est introuvable. Choisis-en un autre."); };
    document.head.appendChild(sc);
  }

  var dernier = lire();
  var connu = liste.filter(function (p) { return p.fichier === dernier; })[0];
  if (connu) charger(connu.fichier);
  else if (liste.length === 1) charger(liste[0].fichier);
  else choisir();
})();
</script>
</body>
